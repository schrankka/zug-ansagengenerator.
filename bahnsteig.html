
<script>
function $(id) {
  return document.getElementById(id);
}

function clean(value) {
  return (value || "").trim();
}

function timeWords(value) {
  if (!value) return "";
  const [h, m] = value.split(":");
  return h + " Uhr" + (m && m !== "00" ? " " + Number(m) : "");
}

function makeAnnouncement() {
  const k = $("kind").value;
  const s = clean($("station").value) || "diesem Bahnhof";
  const p = clean($("platform").value) || "unbekannt";
  const ty = clean($("type").value);
  const n = clean($("number").value);
  const d = clean($("destination").value) || "dem Zielbahnhof";
  const tm = timeWords($("time").value);
  const e = clean($("extra").value);
  let t = "";

  if (k === "arrival") {
    t = `Achtung auf Gleis ${p}. Es fährt ein: der ${ty}${n ? " " + n : ""} aus Richtung ${d}. Bitte Vorsicht bei der Einfahrt.`;
  } else if (k === "departure") {
    t = `Achtung auf Gleis ${p}. Der ${ty}${n ? " " + n : ""} nach ${d}${tm ? ", Abfahrt " + tm : ""}, fährt in Kürze ab. Bitte einsteigen.`;
  } else if (k === "platform") {
    t = `Eine wichtige Information für Reisende am ${s}. Der ${ty}${n ? " " + n : ""} nach ${d} fährt heute abweichend von Gleis ${p}. Bitte beachten Sie die Anzeigen.`;
  } else if (k === "safety") {
    t = `Eine wichtige Information für alle Reisenden am ${s}. Bitte halten Sie Abstand zur Bahnsteigkante und achten Sie auf Ihre persönlichen Gegenstände.`;
  } else {
    t = `Herzlich willkommen am ${s}. Wir wünschen Ihnen einen angenehmen Aufenthalt und eine gute Weiterreise.`;
  }

  if (e) t += " " + e;

  $("output").textContent = t;
  $("status").textContent = "Bahnsteigansage erstellt.";
  window.currentText = t;
  return t;
}

$("generate").addEventListener("click", makeAnnouncement);
makeAnnouncement();
</script>
